[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arch-graphical-installer"
version = "0.1.0"
description = "Staged PySide6 Arch Linux graphical installer"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]
license = "MIT"

[tool.setuptools.packages.find]
include = ["arch_installer*"]
