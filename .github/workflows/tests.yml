name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q arch_installer main.py helper.py
      - run: for script in scripts/*.sh iso/customize.fragment.sh tests/integration/*.sh; do bash -n "$script"; done
      - run: pip install -r requirements.txt
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: QT_QPA_PLATFORM=offscreen python tests/gui_smoke.py
